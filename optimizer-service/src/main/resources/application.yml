spring:
  application:
    name: optimizer-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: optimizer-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

rutaflex:
  optimizer:
    # Tiempo máximo de cálculo por trabajo, y parada anticipada si la solución deja de mejorar.
    spent-limit: ${OPTIMIZER_SPENT_LIMIT:30s}
    unimproved-limit: ${OPTIMIZER_UNIMPROVED_LIMIT:8s}
    random-seed: 42
    # Las peticiones mas antiguas que esto se ignoran (la API ya habra cerrado el trabajo por plazo).
    max-request-age: ${OPTIMIZER_MAX_REQUEST_AGE:1h}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
