<header class="nav">
  <a routerLink="/" class="brand" aria-label="RutaFlex, inicio">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect width="24" height="24" rx="7" fill="#5f6f3a" />
      <path
        d="M6 17c3 0 3-10 6-10s3 10 6 10"
        stroke="#fffdf9"
        stroke-width="2"
        stroke-linecap="round"
      />
      <circle cx="6" cy="17" r="1.6" fill="#fffdf9" />
      <circle cx="18" cy="17" r="1.6" fill="#fffdf9" />
    </svg>
    <span>RutaFlex</span>
  </a>

  <nav aria-label="Principal">
    <a routerLink="/planificacion" routerLinkActive="active">Planificación</a>
    <a routerLink="/resultados" routerLinkActive="active">Resultados</a>
    <a routerLink="/datos" routerLinkActive="active">Datos</a>
  </nav>

  <span class="spacer"></span>

  @if (store.error()) {
    <span class="status down" title="No se puede conectar con la API"> Sin conexión </span>
  } @else if (store.loading()) {
    <span class="status">Cargando…</span>
  } @else {
    <span class="status up" title="Conectado con route-api"> Conectado </span>
  }
</header>

<router-outlet />
