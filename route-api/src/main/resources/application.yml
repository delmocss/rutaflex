spring:
  application:
    name: route-api
  datasource:
    # Los valores por defecto coinciden con docker-compose.yml: `docker compose up -d` y a correr.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rutaflex}
    username: ${DB_USER:rutaflex}
    password: ${DB_PASSWORD:rutaflex}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
