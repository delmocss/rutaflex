spring:
  application:
    name: route-api
  datasource:
    # Los valores por defecto coinciden con docker-compose.yml: `docker compose up -d` y a correr.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rutaflex}
    username: ${DB_USER:rutaflex}
    password: ${DB_PASSWORD:rutaflex}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: route-api
      # Un grupo nuevo empieza por el principio: no se pierde un resultado publicado antes de que el servicio arranque.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  web:
    # Mensajes de validacion siempre en ingles, sea cual sea el idioma del servidor o del cliente:
    # la API responde igual en cualquier maquina (y los tests no dependen de la configuracion regional).
    locale: en
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
