spring:
  application:
    name: route-api
  datasource:
    # Los valores por defecto coinciden con docker-compose.yml: `docker compose up -d` y a correr.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rutaflex}
    username: ${DB_USER:rutaflex}
    password: ${DB_PASSWORD:rutaflex}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        # Acotan el tiempo que una peticion HTTP puede quedar esperando al broker (ver OptimizationRequestPublisher).
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: route-api
      # Un grupo nuevo empieza por el principio: no se pierde un resultado publicado antes de que el servicio arranque.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  web:
    # Mensajes de validacion siempre en ingles, sea cual sea el idioma del servidor o del cliente:
    # la API responde igual en cualquier maquina (y los tests no dependen de la configuracion regional).
    locale: en
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

rutaflex:
  jobs:
    # Un trabajo QUEUED o RUNNING que lleva mas de esto sin terminar se marca FAILED: es la red de seguridad
    # frente a mensajes perdidos, para que ningun trabajo bloquee su almacen y dia para siempre.
    timeout: ${RUTAFLEX_JOBS_TIMEOUT:10m}
    reaper-interval: ${RUTAFLEX_JOBS_REAPER_INTERVAL:30s}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
