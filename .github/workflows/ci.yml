name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    name: Build y tests (los tres modulos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Los tests de integracion usan Testcontainers (PostGIS real); los runners de GitHub ya traen Docker.
      - run: mvn -B verify

  frontend:
    name: Frontend (formato, build y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test -- --no-watch

