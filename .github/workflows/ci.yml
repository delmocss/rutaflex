name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    name: Build y tests (los tres modulos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Los tests de integracion usan Testcontainers (PostGIS real); los runners de GitHub ya traen Docker.
      - run: mvn -B verify
